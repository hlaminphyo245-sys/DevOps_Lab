name: A workflow for my DevOps Lab App
on: push
jobs:
  build:
    name: Build and Test Action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup network and MongoDB
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo
      - name: Build with Maven
        run: mvn package
      - name: Build Docker Image
        run: docker build -t devops_lab .
      - name: Run image
        run: docker run --network se-methods --name devopscontainer devops_lab
      - name: View logs
        run: docker logs devopscontainer
